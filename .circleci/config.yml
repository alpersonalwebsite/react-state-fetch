version: 2.1

jobs:
  build:
    docker:
      # Pinned. `node:lts` floats, so the image changed under a project frozen on
      # Create React App 3 every time a new LTS shipped, and the build could break
      # with no commit behind it. 12 is this project's era.
      - image: cimg/node:12.22
    steps:
      - checkout

      # npm ci, not npm install: installs exactly what package-lock.json pins, and
      # fails if the lockfile and package.json disagree.
      - run: npm ci

      # Was commented out.
      - run:
          name: Test
          command: npm test -- --watchAll=false

      - run: npm run lint

      # CI is deliberately NOT set to false. Create React App treats warnings as errors
      # when CI is set, and that setting is what hid a real react-hooks/exhaustive-deps
      # bug in useFetch: the hook's dependency array was [] while it closed over URI,
      # so it silently never refetched.
      - run: npm run build
